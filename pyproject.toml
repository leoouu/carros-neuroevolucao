[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carros"
version = "0.1.0"
description = "Carrinhos que aprendem a dirigir via neuroevolução (NumPy + Pygame)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["carros*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*", "imageio_ffmpeg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
